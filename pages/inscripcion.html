		<script src="inscripcion.js"></script>
		<img src="/excursion.png">
		<h1>Nos vamos de escursión a Perú !!!</h1>
		<form action="/inscripcion" method="POST">
			<h2>Formulario de inscripción:</h2>
			<label>
				Nombre:
				<input data-input-type="fill" type="text" name="nombre">
			</label>
			<label>
				Apellido 1:
				<input data-input-type="fill" type="text" name="apellido1">
			</label>
			<label>
				Apellido 2:
				<input data-input-type="fill" type="text" name="apellido2">
			</label>
			<label>
				<br>
				Correo (que sea de verdad que si no no te llega xd):
				<input data-input-type="correo" type="email" name="correo">
			</label>
			<p>Tienes la vacuna del dengue?:</p>
			<label>
				Sí
				<input data-input-type="almenosuno" type="radio" name="vacuna" value="si">
			</label>
			<label>
				No
				<input data-input-type="almenosuno" type="radio" name="vacuna" value="no">
			</label>
			<p>Tienes seguro médico?</p>
			<label>
				Sí
				<input data-input-type="almenosuno" type="radio" name="seguro" value="si">
			</label>
			<label>
				No
				<input data-input-type="almenosuno" type="radio" name="seguro" value="no">
			</label>
			<strong><br>Si no tienes ni seguro ni vacuna no te dejamos venir eh<br></strong>
			<p><b class="error" style="display: none; color: red;">No hay errores de momento</b></p>
			<input id="inscribirse" type="submit" value="INSCRIBIRSE" disabled=true>
